[package]
name = "eof"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.1"
ammonia = "4.2.5"
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
futures = "0.3.34"
hex = "0.4.3"
hkdf = "0.13.0"
mime_guess = "2.0.5"
p256 = { version = "0.14.0", features = ["ecdh", "ecdsa"] }
pulldown-cmark = "0.13.6"
rand = "0.10.4"
regex = "1.13.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust-embed = "8.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate", "macros", "json", "derive", "tls-rustls-ring"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower-http = { version = "0.7.1", features = ["trace", "compression-gzip", "set-header", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.29.3", features = ["v4", "serde"] }
webauthn-rs = { version = "0.6.2", features = ["danger-allow-state-serialisation"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
